# N5 kanji — the full commonly-taught set (~106 characters).
#
# Self-authored, like the rest of the course: no proprietary JLPT list is copied.
# (The JLPT stopped publishing official lists in 2010; this is the set N5 prep
# material conventionally converges on, written from scratch.)
#
# Readings are the ones a beginner meets first, not an exhaustive list: a kanji's
# applicable reading depends on the word, and each card's own romaji stays the
# authority for how that word is read.
#
# Okurigana convention — a deliberate teaching decision. When a kun reading is a
# verb or adjective *stem*, the inflectional ending is shown in parentheses:
# た(べる), あ(がる), あたら(しい). A bare stem (た, あ) is unpronounceable and
# meaningless to a beginner; the parentheses say "the kanji reads た, the word
# continues べる in kana" — the dictionary convention, and one that maps cleanly
# onto the root-plus-ending intuition Spanish speakers already have from
# conjugation. Standalone-word readings (みず, やま) carry no parentheses.
