# N5 kanji — seed batch.
#
# Self-authored, like the rest of the course: no proprietary JLPT list is copied.
# These are the most frequent kanji of the level, chosen to pair with vocabulary
# the course already teaches (numbers, people, time, places).
#
# Readings are the ones a beginner meets first, not an exhaustive list: a kanji's
# applicable reading depends on the word, and each card's own romaji stays the
# authority for how that word is read.
