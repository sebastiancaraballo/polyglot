id: verbs-te-form
title: "Verbos: forma te"
jlpt: N5
functions: [polite-requests]
cards:
  - es: "Comiendo / Come (forma te)"
    jp: "たべて"
    romaji: "tabete"
    notes: "Forma te de たべる; base de ...てください (petición cortés)."
  - es: "Bebiendo / Bebe (forma te)"
    jp: "のんで"
    romaji: "nonde"
    notes: "Forma te de のむ: los verbos en -mu/-bu/-nu cambian a ...んで."
  - es: "Mirando / Mira (forma te)"
    jp: "みて"
    romaji: "mite"
    notes: "Forma te de みる."
  - es: "Leyendo / Lee (forma te)"
    jp: "よんで"
    romaji: "yonde"
    notes: "Forma te de よむ: los verbos en -mu/-bu/-nu cambian a ...んで."
  - es: "Escribiendo / Escribe (forma te)"
    jp: "かいて"
    romaji: "kaite"
    notes: "Forma te de かく: los verbos en -ku cambian a ...いて."
  - es: "Yendo / Ve (forma te)"
    jp: "いって"
    romaji: "itte"
    notes: "Forma te irregular de いく (excepción: no sigue el patrón -ku → -いて)."
