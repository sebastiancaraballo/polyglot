id: courtesy-expressions
title: "Expresiones de cortesía"
jlpt: N5
functions: [basic-courtesy]
cards:
  - es: "Perdón / Disculpe"
    jp: "すみません"
    romaji: "sumimasen"
  - es: "Lo siento"
    jp: "ごめんなさい"
    romaji: "gomennasai"
  - es: "De nada"
    jp: "どういたしまして"
    romaji: "dōitashimashite"
  - es: "Que aproveche (antes de comer)"
    jp: "いただきます"
    romaji: "itadakimasu"
  - es: "Gracias por la comida (al terminar)"
    jp: "ごちそうさま"
    romaji: "gochisōsama"
  - es: "Me voy (al salir de casa)"
    jp: "いってきます"
    romaji: "ittekimasu"
  - es: "Que te vaya bien"
    jp: "いってらっしゃい"
    romaji: "itterasshai"
  - es: "Ya estoy en casa"
    jp: "ただいま"
    romaji: "tadaima"
  - es: "Bienvenido a casa"
    jp: "おかえりなさい"
    romaji: "okaerinasai"
  - es: "Buenas noches (al acostarse)"
    jp: "おやすみなさい"
    romaji: "oyasuminasai"
  - es: "Encantado / Mucho gusto"
    jp: "はじめまして"
    romaji: "hajimemashite"
  - es: "Con permiso / Disculpe la molestia"
    jp: "しつれいします"
    romaji: "shitsurei shimasu"
