[package]
name = "polyglot-core"
description = "Language-agnostic learning engine for Polyglot (domain model, SRS, content)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono.workspace = true
dirs = "5"
